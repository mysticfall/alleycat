name: alleycat

services:
  whisper-api:
    image: hwdsl2/whisper-live-server:cuda
    container_name: alleycat-whisper-api
    ports:
      - "8000:8000"
    volumes:
      - whisper-data:/var/lib/whisper-live
    runtime: nvidia
    environment:
      - WHISPERLIVE_MODEL=small
      - WHISPERLIVE_LANGUAGE=auto
      - WHISPERLIVE_API_KEY=
      - WHISPERLIVE_DISABLE_USAGE_COUNTS=1
      - NVIDIA_VISIBLE_DEVICES=all
  audio2face-api:
    image: audio2face-api
    container_name: alleycat-audio2face-api
    build:
      context: ./audio2face-api-server
      secrets:
        - hf_token
    ports:
      - "8765:8765"
    volumes:
      - audio2face-data:/app/models
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
  kev-decision-api:
    image: kev-decision-api
    container_name: alleycat-kev-decision-api
    build:
      context: ./kev-decision-server
    ports:
      - "8081:8080"
    volumes:
      - kev-decision-data:/models
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15m
volumes:
  whisper-data:
    name: whisper-data
  audio2face-data:
    name: audio2face-data
  kev-decision-data:
    name: kev-decision-data
secrets:
  hf_token:
    environment: HF_TOKEN

