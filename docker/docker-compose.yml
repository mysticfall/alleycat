services:
  whisper-api:
    image: hwdsl2/whisper-server:cuda
    container_name: alleycat-whisper-api
    ports:
      - "9000:9000"
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      - WHISPER_MODEL=small.en
      - WHISPER_DEVICE=auto
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_API_KEY=
      - HF_TOKEN=${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  audio2face-api:
    image: audio2face-api
    container_name: alleycat-audio2face-api
    build:
      context: ./audio2face-api-server
    ports:
      - "8765:8765"
    volumes:
      - audio2face-data:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  whisper-data:
    name: whisper-data
  audio2face-data:
    name: audio2face-data
