# Shipped default configuration for AlleyCat.
#
# Users can override any value below by creating an AlleyCat.yaml file in their
# user data directory (user://AlleyCat.yaml). Override values are merged over
# these shipped defaults, so a user file only needs to contain the values that
# should change.

# Speech-to-text backend settings (OpenAI-SDK-compatible REST), read by the player template's OpenAITranscriber.
# The spoken language of the selected content pack overrides Language at runtime (CORE-008); Model must stay a
# multilingual variant so non-English packs transcribe in their own language.
STT:
    Host: "http://localhost:8000/v1"
    Model: whisper-1
    ApiKey: ""
    Language: en
    Prompt: "Transcribe the player's speech clearly."
    #Hotwords: "alleycat felis catus"          # Optional unusual-word recognition hints; blank or omitted disables them.
    Timeout: 30

# Text-to-speech backend settings.
TTS:
    Host: "http://localhost:8004/v1"
    Model: tts-1
    Voice: alloy
    Format: wav
    SpeedRatio: 1.0
    Timeout: 30

# Conversational AI backend settings.
AI:
    Host: "https://openrouter.ai/api/v1"
    Model: google/gemma-4-31b-it
    Timeout: 30
    # Optional reasoning-effort control forwarded on every mind request to the configured backend.
    # Accepted values: none, low, medium, high, xhigh. This is a provider request parameter, not
    # a guarantee of reasoning behaviour: backends and models vary in the levels they accept.
    #ReasoningEffort: "medium"
    # Optional reasoning-summary detail requested from the provider on every mind request.
    # Accepted values: auto, concise, detailed. Only the Responses endpoint supports this setting; a
    # configured value is rejected before dispatch when Chat Completions is selected. Returned summaries
    # are diagnostic provider renderings, not guaranteed reasoning: backends may return none at all.
    #ReasoningVerbosity: "detailed"
    # Visual AI context delivery for character minds (AI-013). Accepted values: tools, auto, off.
    # tools (the default): the model calls the minimap and view-capture tools itself; auto: both images
    # are captured and attached to every request; off: no visual context at all. Unset or blank means
    # tools. The mode is read once at session start and stays fixed for that session.
    #VisualContextMode: "tools"
    # Chat client adapter kind selecting the provider endpoint's protocol (AI-002). Accepted values:
    # chatcompletions, responses. A configured value overrides the provider resource's own kind; unset
    # or blank keeps it (default responses). OpenAI-compatible backends — OpenRouter, llama.cpp, and
    # similar — must be declared chatcompletions: such backends drop image parts inside tool outputs,
    # so a responses misconfiguration fails silently as image loss in AI-013 visual-context results.
    #ChatClientKind: "chatcompletions"

# Live LLM test backend settings, read only by opt-in integration tests run with --live-llm.
# Supply real values through the user override (user://AlleyCat.yaml) instead of committing them
# here; the example stays commented out so shipped defaults define no active section.
#AITest:
#    Host: "https://openrouter.ai/api/v1"
#    Model: google/gemma-4-31b-it
#    ApiKey: "<your-api-key>"
#    Timeout: 30

# Independent typed decisions. Zero-configuration default: the local Docker kev-decision-api service
# (SystemOne at http://localhost:8081/v1/systemone) — no key or model needed, nothing sent until a caller asks.
# Host includes the API base prefix; do not append /decisions or /systemone here.
# Decision:
#     APIKind: OpenRouter
#     Host: "https://openrouter.ai/api/alpha"
#     Model: "typesafe/jev-1.14-20261014"
#     ApiKey: "<set only in user://AlleyCat.yaml>"
#     Timeout: 30
# OpenAI alternative: APIKind: OpenAI, Host: "https://api.openai.com/v1", Model: "gpt-6-luna".
# SystemOne overrides (all optional): APIKind: SystemOne, Host: "http://localhost:8081/v1", Timeout: 30.

# Wait-gate timing for character minds. While a character waits, the decision model classifies whether their
# latest speech or action still awaits a response and whether the circumstances call for them to act; code owns
# the timing. An arrived response or a must-act verdict starts the character at once; otherwise the verdict arms
# one of these deadlines (seconds), after which the character gets a chance to act. An armed deadline is never
# extended: later verdicts can only shorten it. A failed decision call counts as NoReason for timing, so a waiting
# character always gets a chance to act eventually. Each armed deadline is scaled by a random factor within
# ±TimeoutJitter (a ratio, 0–0.9) so several waiting characters do not wake in lockstep.
DecisionWait:
    ResponsePendingTimeout: 5   # Their speech or action expects a response that has not arrived yet.
    MayActTimeout: 3            # Nobody waits on them, but the scene offers an opening to act.
    NoReasonTimeout: 10         # They have no particular reason to act.
    TimeoutJitter: 0.2

# Diagnostics toggles for AI request and response logging.
Diagnostics:
    AI:
        EnableRequestResponseLogging: true
        # Human-readable per-cycle Markdown transcripts under user://logs/mind/ (AI-011); disabled by default.
        EnableSessionTranscriptLogging: false
        # Per-evaluation JSON decision-payload dumps following the transcript-log convention (AI-011 TR-2–TR-5):
        # under user://logs/mind/<game-run-timestamp>/<character>/decision-payloads/, one subdirectory per question
        # category (decision-gate experiment: gaze/ for the look-target policy, wait/ for the wait gate), beside
        # that character's session transcripts: the verbatim evidence and questions the decision gate dispatched,
        # plus the answers, resolved verdict, wait deadline and latency — one file per evaluation, named
        # {timestamp}_{character}_{trigger}_{verdict}.json (wait verdicts: now, arm-5.2s, keep-3.1s, failed).
        # Disabled by default; enabling it costs one small file write per gate evaluation.
        #EnableDecisionPayloadLogging: false

# Logging levels per category.
Logging:
    LogLevel:
        Default: Warning
        AlleyCat: Information
        AlleyCat.Pipeline: Debug
        # Toggles the in-game "dispatching audio to STT" notification; set to None to disable it.
        # AlleyCat.Pipeline.STT: Debug
        Microsoft: Warning
        Microsoft.Extensions.AI.LoggingChatClient: Trace
        System.ClientModel.Primitives.MessageLoggingPolicy: Warning
        System.ClientModel.Primitives.PipelineTransport: Warning

