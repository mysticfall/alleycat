# Shipped default configuration for AlleyCat.
#
# Users can override any value below by creating an AlleyCat.yaml file in their
# user data directory (user://AlleyCat.yaml). Override values are merged over
# these shipped defaults, so a user file only needs to contain the values that
# should change.

# Speech-to-text backend settings (OpenAI-SDK-compatible REST), read by the player template's OpenAITranscriber.
STT:
    Host: "http://localhost:8000/v1"
    Model: small.en
    ApiKey: ""
    Language: en
    Prompt: "Transcribe the player's speech clearly."
    #Hotwords: "alleycat felis catus"          # Optional unusual-word recognition hints; blank or omitted disables them.
    Timeout: 30

# Text-to-speech backend settings.
TTS:
    Host: "http://localhost:8004/v1"
    Model: tts-1
    Voice: alloy
    Format: wav
    SpeedRatio: 1.0
    Timeout: 30

# Conversational AI backend settings.
AI:
    Host: "https://openrouter.ai/api/v1"
    Model: google/gemma-4-31b-it
    Timeout: 30

# Live LLM test backend settings, read only by opt-in integration tests run with --live-llm.
# Supply real values through the user override (user://AlleyCat.yaml) instead of committing them
# here; the example stays commented out so shipped defaults define no active section.
#AITest:
#    Host: "https://openrouter.ai/api/v1"
#    Model: google/gemma-4-31b-it
#    ApiKey: "<your-api-key>"
#    Timeout: 30

# Diagnostics toggles for AI request and response logging.
Diagnostics:
    AI:
        EnableRequestResponseLogging: true

# Logging levels per category.
Logging:
    LogLevel:
        Default: Warning
        AlleyCat: Information
        AlleyCat.Pipeline: Debug
        # Toggles the in-game "dispatching audio to STT" notification; set to None to disable it.
        # AlleyCat.Pipeline.STT: Debug
        Microsoft: Warning
        Microsoft.Extensions.AI.LoggingChatClient: Trace
        System.ClientModel.Primitives.MessageLoggingPolicy: Warning
        System.ClientModel.Primitives.PipelineTransport: Warning
